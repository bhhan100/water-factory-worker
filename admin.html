<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>水厂管家老板端</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC";

background:#f5f7fb;

}



.header{

background:#1677ff;

color:white;

padding:25px;

border-radius:0 0 25px 25px;

}


.header h2{

margin:0;

}



.menu{

position:fixed;

top:0;

left:-270px;

width:270px;

height:100%;

background:white;

z-index:10;

padding:25px;

transition:.3s;

box-shadow:2px 0 10px #aaa;

}



.menu.open{

left:0;

}



.menu-item{

padding:16px 0;

border-bottom:1px solid #eee;

}




.mask{

position:fixed;

inset:0;

background:#0006;

display:none;

z-index:5;

}


.mask.show{

display:block;

}




.card{

background:white;

margin:15px;

padding:20px;

border-radius:20px;

}




.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}



.box{

background:#eef6ff;

padding:15px;

border-radius:15px;

}



.number{

font-size:26px;

font-weight:bold;

color:#1677ff;

}



button{

width:100%;

padding:14px;

border:0;

border-radius:12px;

background:#1677ff;

color:white;

font-size:16px;

}



.demo{

background:#52c41a;

margin-top:10px;

}



.item{

padding:12px 0;

border-bottom:1px solid #eee;

}



.red{

color:red;

font-weight:bold;

}



canvas{

max-height:260px;

}



</style>


</head>



<body>



<!-- 左侧菜单 -->


<div class="menu" id="menu">


<h3>
☰ 管理中心
</h3>



<div class="menu-item">

📊 经营分析

</div>



<div class="menu-item">

🥧 销售分析

</div>



<div class="menu-item">

👥 客户管理

</div>



<div class="menu-item">

💰 欠款管理

</div>



<div class="menu-item">

📦 库存管理

</div>



<div class="menu-item"
onclick="demoData()">

🎭 加载演示数据

</div>



<div class="menu-item"
onclick="exportExcel()">

📥 导出Excel

</div>



</div>





<div class="mask" id="mask"
onclick="closeMenu()">

</div>







<div class="header">


<h2 onclick="openMenu()">

☰ 💧 水厂管家

</h2>


<p>

老板数据中心 V0.4

</p>


</div>









<div class="card">


<h3>
📊 今日经营
</h3>



<div class="grid">


<div class="box">

收入

<div class="number" id="money">

¥0

</div>

</div>



<div class="box">

订单

<div class="number" id="count">

0

</div>

</div>



<div class="box">

欠款

<div class="number" id="debt">

¥0

</div>

</div>



<div class="box">

销量

<div class="number" id="sale">

0

</div>

</div>


</div>


</div>








<div class="card">

<h3>
📈 收入趋势
</h3>


<canvas id="incomeChart">

</canvas>


</div>







<div class="card">


<h3>
🥧 产品销售占比
</h3>


<canvas id="productChart">

</canvas>


</div>








<div class="card">


<h3>
👥 客户销售占比
</h3>


<canvas id="customerChart">

</canvas>


</div>









<div class="card">


<h3>
💰 欠款排行榜
</h3>


<div id="debts">

暂无

</div>


</div>








<div class="card">


<h3>
📋 最近订单
</h3>


<div id="orders">

暂无

</div>


</div>
<script>


// =====================
// 菜单
// =====================


function openMenu(){

document
.getElementById("menu")
.classList.add("open");


document
.getElementById("mask")
.classList.add("show");


}



function closeMenu(){

document
.getElementById("menu")
.classList.remove("open");


document
.getElementById("mask")
.classList.remove("show");


}







// =====================
// 读取数据
// =====================


let orders =

JSON.parse(

localStorage.getItem("orders")

|| "[]"

);








// =====================
// 数据分析
// =====================


function analysis(){



let money=0;

let debt=0;

let sale=0;



let products={

"瓶装水":0,

"普苏":0,

"循环桶":0,

"循环桶回桶":0,

"一次性":0,

"定制水":0

};



let customers={};


let debts={};





orders.forEach(o=>{


money+=Number(o.金额);



if(o.付款!="已付款"){


debt+=Number(o.金额);



if(!debts[o.客户]){

debts[o.客户]=0;

}


debts[o.客户]+=Number(o.金额);


}





if(!customers[o.客户]){

customers[o.客户]=0;

}


customers[o.客户]+=Number(o.金额);






o.商品.forEach(p=>{


sale+=Number(p.qty);



if(products[p.product]!=undefined){

products[p.product]+=Number(p.qty);

}


});




});







document.getElementById("money")
.innerHTML="¥"+money;



document.getElementById("count")
.innerHTML=orders.length;



document.getElementById("debt")
.innerHTML="¥"+debt;



document.getElementById("sale")
.innerHTML=sale;







// 产品图


new Chart(

document.getElementById("productChart"),

{

type:"pie",

data:{


labels:Object.keys(products),


datasets:[{

data:Object.values(products)

}]


}

}

);








// 客户图


new Chart(

document.getElementById("customerChart"),

{

type:"pie",

data:{


labels:Object.keys(customers),


datasets:[{

data:Object.values(customers)

}]


}


}

);








// 收入趋势


let day={};



orders.forEach(o=>{


let d=o.时间.split(" ")[0];


if(!day[d]){

day[d]=0;

}


day[d]+=Number(o.金额);


});




new Chart(

document.getElementById("incomeChart"),

{

type:"line",

data:{


labels:Object.keys(day),


datasets:[{

label:"收入",

data:Object.values(day)

}]

}

}

);







// 欠款


let dh="";



for(let c in debts){


dh+=`

<div class="item red">

${c}

欠款：

¥${debts[c]}

</div>

`;


}



document.getElementById("debts")

.innerHTML=

dh||"暂无欠款";








// 订单


let oh="";



orders.slice().reverse()

.forEach(o=>{


let goods="";


o.商品.forEach(p=>{


goods+=

p.product+

" × "+

p.qty+

p.unit+

"<br>";



});




oh+=`

<div class="item">


客户：

${o.客户}


<br>


商品：

<br>

${goods}


金额：

¥${o.金额}


<br>


付款：

${o.付款}


</div>

`;



});



document.getElementById("orders")

.innerHTML=

oh||"暂无订单";



}








// =====================
// 演示数据
// =====================


function demoData(){


let demo=[


["王老板",580,"未付款",
[
["瓶装水",5,"箱"],
["循环桶",10,"桶"],
["循环桶回桶",8,"桶"]
]],


["李老板",320,"已付款",
[
["普苏",8,"桶"],
["瓶装水",2,"箱"]
]],


["陈经理",860,"部分付款",
[
["定制水",20,"包"],
["循环桶",15,"桶"]
]],


["赵老板",450,"已付款",
[
["一次性",10,"箱"],
["瓶装水",5,"箱"]
]],


["刘老板",1200,"未付款",
[
["循环桶",30,"桶"],
["定制水",50,"包"]
]],


["周老板",260,"已付款",
[
["普苏",13,"桶"]
]],


["孙老板",780,"未付款",
[
["瓶装水",20,"箱"],
["循环桶",10,"桶"]
]],


["吴老板",530,"已付款",
[
["定制水",30,"包"]
]],


["郑老板",980,"未付款",
[
["循环桶",40,"桶"]
]],


["陈老板",400,"已付款",
[
["瓶装水",10,"箱"]
]]


];






let arr=[];



demo.forEach((d,i)=>{


let goods=[];

let total=0;



d[3].forEach(g=>{


let amount=50;


goods.push({

product:g[0],

qty:g[1],

unit:g[2],

price:amount,

amount:amount*g[1]

});



total+=amount*g[1];


});





arr.push({


编号:10001+i,


时间:"2026-07-30 "+(9+i)+":00",


工人:
i%2==0?
"李师傅":
"张师傅",


客户:d[0],


商品:goods,


金额:total,


付款:d[2]



});


});







localStorage.setItem(

"orders",

JSON.stringify(arr)

);



alert("演示数据加载成功");


location.reload();



}








// =====================
// Excel导出
// =====================


function exportExcel(){



let csv=

"订单号,时间,工人,客户,商品,金额,付款\n";



orders.forEach(o=>{


let g="";


o.商品.forEach(p=>{


g+=

p.product+

"×"+

p.qty+

p.unit+

" ";


});




csv+=

o.编号+

","+

o.时间+

","+

o.工人+

","+

o.客户+

","+

g+

","+

o.金额+

","+

o.付款+

"\n";



});





let blob=new Blob(

[
"\ufeff"+csv
],

{

type:"text/csv;charset=utf-8"

}

);



let url=

URL.createObjectURL(blob);



let a=document.createElement("a");


a.href=url;


a.download="水厂经营日报.csv";


a.click();



}







analysis();


</script>


</body>

</html>
