<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>水厂管家老板端</title>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC";
background:#f5f7fb;
}

.header{
background:#1677ff;
color:white;
padding:25px;
border-radius:0 0 25px 25px;
}

.card{
background:white;
margin:15px;
padding:20px;
border-radius:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.box{
background:#eef6ff;
padding:15px;
border-radius:15px;
}

.number{
font-size:25px;
font-weight:bold;
color:#1677ff;
}


button{

width:100%;
padding:15px;
border-radius:12px;
border:none;
background:#1677ff;
color:white;
font-size:16px;

}


.item{

border-bottom:1px solid #eee;
padding:15px 0;

}


.red{

color:red;
font-weight:bold;

}

</style>

</head>


<body>



<div class="header">

<h2>💧 水厂管家</h2>

<p>老板管理后台 V0.2</p>

</div>




<div class="card">

<h3>📊 今日经营</h3>


<div class="grid">


<div class="box">

营业额

<div id="money" class="number">
¥0
</div>

</div>


<div class="box">

订单

<div id="count" class="number">
0
</div>

</div>



<div class="box">

未收款

<div id="debt" class="number">
¥0
</div>

</div>



<div class="box">

商品数量

<div id="num" class="number">
0
</div>

</div>


</div>


</div>





<div class="card">

<h3>📦 产品销售</h3>

<div id="products">

</div>


</div>





<div class="card">

<h3>💰 欠款客户</h3>

<div id="debts">

</div>


</div>




<div class="card">

<h3>📥 数据导出</h3>

<button onclick="exportExcel()">

导出Excel销售记录

</button>

</div>




<div class="card">

<h3>📋 全部订单</h3>

<div id="orders">

暂无订单

</div>


</div>
<script>


let orders =
JSON.parse(localStorage.getItem("orders")||"[]");




// 数据统计

function analysis(){


let money=0;

let debt=0;


let products={

"瓶装水":0,

"普苏":0,

"循环桶":0,

"循环桶回桶":0,

"一次性":0,

"定制水":0

};



let debtList={};



orders.forEach(o=>{


money += Number(o.金额);



if(o.付款!="已付款"){

debt += Number(o.金额);



if(!debtList[o.客户]){

debtList[o.客户]=0;

}


debtList[o.客户]+=Number(o.金额);


}




o.商品.forEach(p=>{


if(products[p.product]!=undefined){

products[p.product]+=Number(p.qty);

}


});


});





// 首页数据

document.getElementById("money")
.innerHTML="¥"+money;


document.getElementById("count")
.innerHTML=orders.length;


document.getElementById("debt")
.innerHTML="¥"+debt;


document.getElementById("num")
.innerHTML=
Object.values(products)
.reduce((a,b)=>a+b,0);






// 产品统计

let productHTML="";


for(let p in products){


productHTML+=`

<div class="item">

${p}

：

${products[p]}

</div>

`;

}


document.getElementById("products")
.innerHTML=
productHTML;






// 欠款客户

let debtHTML="";


for(let c in debtList){


debtHTML+=`

<div class="item red">

${c}

欠款：

¥${debtList[c]}

</div>

`;

}



document.getElementById("debts")
.innerHTML=
debtHTML||"暂无欠款";






showOrders();



}








// 显示订单

function showOrders(){


let html="";


orders
.slice()
.reverse()
.forEach(o=>{


let goods="";


o.商品.forEach(p=>{


goods+=

p.product+
" × "+
p.qty+
p.unit+
"<br>";



});



html+=`

<div class="item">


订单号：

${o.编号}

<br>


时间：

${o.时间}

<br>


工人：

${o.工人}

<br>


客户：

${o.客户}

<br>


商品：

<br>

${goods}


金额：

¥${o.金额}

<br>


付款：

${o.付款}


</div>


`;



});



document.getElementById("orders")
.innerHTML=

html||"暂无订单";


}








// 导出Excel

function exportExcel(){



let csv=

"订单号,时间,工人,客户,商品,金额,付款\n";



orders.forEach(o=>{


let goods="";


o.商品.forEach(p=>{


goods+=

p.product+
"×"+
p.qty+
p.unit+
" ";


});



csv +=

o.编号+
","+

o.时间+
","+

o.工人+
","+

o.客户+
","+

goods+
","+

o.金额+
","+

o.付款+
"\n";


});





let blob=new Blob(

[
"\ufeff"+csv
],

{

type:
"text/csv;charset=utf-8"

}

);





let url=
URL.createObjectURL(blob);



let a=
document.createElement("a");


a.href=url;


a.download=
"水厂销售记录.csv";


a.click();



}





analysis();


</script>


</body>

</html>
