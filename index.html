<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>水厂管家</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#f5f7fb;

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC";

}



.header{

background:#1677ff;

color:white;

padding:25px;

border-radius:0 0 25px 25px;

}



.header h2{

margin:0;

}



.card{

background:white;

margin:15px;

padding:18px;

border-radius:20px;

}



.title{

font-size:18px;

font-weight:bold;

margin-bottom:15px;

}



input{

width:100%;

padding:14px;

border-radius:12px;

border:1px solid #ddd;

font-size:16px;

}



.history div{

padding:8px;

background:#f2f6ff;

margin-top:5px;

border-radius:10px;

}



.products{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:10px;

}



.product{

background:#eef6ff;

color:#1677ff;

padding:15px 5px;

border-radius:15px;

text-align:center;

}



.product span{

display:block;

font-size:25px;

}



.item{

display:flex;

justify-content:space-between;

align-items:center;

background:#fafafa;

padding:12px;

border-radius:15px;

margin-top:10px;

}



.counter{

display:flex;

gap:8px;

align-items:center;

}



.counter button{

width:35px;

height:35px;

border:0;

background:#1677ff;

color:white;

border-radius:10px;

font-size:20px;

}



.money{

font-size:30px;

font-weight:bold;

color:#1677ff;

}



.pay{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:8px;

}



.pay button{

padding:12px;

border:0;

border-radius:12px;

background:#eee;

}



.pay .active{

background:#1677ff;

color:white;

}



.submit{

width:100%;

padding:16px;

margin-top:15px;

border:0;

border-radius:15px;

background:#1677ff;

color:white;

font-size:18px;

}



</style>

</head>


<body>


<div class="header">

<h2>💧 水厂管家</h2>

<p>出库登记端 V2.2</p>

</div>


<div class="card">


<div class="title">
👷 操作员
</div>


<input id="worker"
placeholder="姓名">


</div>



<div class="card">


<div class="title">
👤 客户
</div>


<input id="customer"
placeholder="客户名称">


<div id="history"></div>


</div>



<div class="card">


<div class="title">
🚚 选择出货商品
</div>


<div class="products">


<div class="product"
onclick="addProduct('瓶装水')">

<span>🧴</span>
瓶装水

</div>


<div class="product"
onclick="addProduct('普苏')">

<span>📦</span>
普苏

</div>


<div class="product"
onclick="addProduct('循环桶')">

<span>🪣</span>
循环桶

</div>


<div class="product"
onclick="addProduct('循环桶回桶')">

<span>↩️</span>
回桶

</div>


<div class="product"
onclick="addProduct('一次性')">

<span>💧</span>
一次性

</div>


<div class="product"
onclick="addProduct('定制水')">

<span>✨</span>
定制水

</div>


</div>



<div id="cart">

暂无商品

</div>


</div>



<div class="card">


<div class="title">
💰 成交金额
</div>


<div class="money">

¥ <span id="showMoney">
0
</span>

</div>


<br>


<input
id="money"
type="number"
placeholder="输入实际收款金额">



<div class="title">

付款状态

</div>


<div class="pay">


<button
id="paid"
onclick="setPay('已付款')">

已付

</button>


<button
id="part"
onclick="setPay('部分付款')">

部分

</button>


<button
id="unpaid"
onclick="setPay('未付款')">

欠款

</button>


</div>



<br>


<input
id="remark"
placeholder="备注">



<button
class="submit"
onclick="submitOrder()">

提交出库

</button>


</div>


<script>

let cart=[];

let payStatus="已付款";
// ======================
// 读取订单数据
// ======================

let orders = 
JSON.parse(
localStorage.getItem("orders") || "[]"
);


// ======================
// 初始化记忆
// ======================

let oldWorker =
localStorage.getItem("workerName");


if(oldWorker){

document.getElementById("worker").value =
oldWorker;

}



// ======================
// 添加商品
// ======================

function addProduct(name){


let item =
cart.find(
i=>i.product==name
);



if(item){

item.qty++;

}else{


cart.push({

product:name,

qty:1,


unit:
name=="循环桶回桶"
?
"个"
:
(
name=="普苏"
?
"桶"
:
"箱"
)


});


}


renderCart();


}



// ======================
// 显示商品
// ======================


function renderCart(){


let html="";


cart.forEach((item,index)=>{


html+=`

<div class="item">


<div>

<b>
${item.product}
</b>

<br>

${item.qty}${item.unit}

</div>


<div class="counter">


<button onclick="changeQty(${index},-1)">
-
</button>


<span>
${item.qty}
</span>


<button onclick="changeQty(${index},1)">
+
</button>


</div>


</div>


`;



});



document.getElementById("cart").innerHTML =
html || "暂无商品";


}



// ======================
// 数量调整
// ======================


function changeQty(index,num){


cart[index].qty += num;



if(cart[index].qty<=0){

cart.splice(index,1);

}


renderCart();


}



// ======================
// 付款状态
// ======================


function setPay(status){


payStatus=status;



document
.querySelectorAll(".pay button")
.forEach(
b=>b.classList.remove("active")
);



if(status=="已付款"){

document
.getElementById("paid")
.classList.add("active");

}



if(status=="部分付款"){

document
.getElementById("part")
.classList.add("active");

}



if(status=="未付款"){

document
.getElementById("unpaid")
.classList.add("active");

}



}



// ======================
// 客户历史
// ======================


document
.getElementById("customer")
.addEventListener(
"input",
showHistory
);



function showHistory(){


let value =
document
.getElementById("customer")
.value;



let box =
document.getElementById("history");



if(!value){

box.innerHTML="";

return;

}



let customers =
[
...new Set(
orders.map(
o=>o.客户
)
)
];



let result =
customers.filter(
c=>c.includes(value)
);



box.innerHTML =

result.map(

c=>`

<div onclick="chooseCustomer('${c}')">

📌 ${c}

</div>

`

).join("");



}



function chooseCustomer(name){


document
.getElementById("customer")
.value=name;


document
.getElementById("history")
.innerHTML="";


}



// ======================
// 金额显示
// ======================


document
.getElementById("money")
.addEventListener(
"input",
function(){


document
.getElementById("showMoney")
.innerHTML =
this.value || 0;


}

);




// ======================
// 提交订单
// ======================


function submitOrder(){



let worker =
document
.getElementById("worker")
.value
.trim();



let customer =
document
.getElementById("customer")
.value
.trim();



let money =
Number(
document
.getElementById("money")
.value
);



if(!worker){

alert("请输入操作员");

return;

}



if(!customer){

alert("请输入客户");

return;

}



if(cart.length==0){

alert("请选择商品");

return;

}



if(!money){

alert("请输入金额");

return;

}




let order={


编号:
Date.now(),


时间:
new Date()
.toLocaleString(),



工人:
worker,



客户:
customer,



商品:
cart,



金额:
money,



付款:
payStatus,



备注:
document
.getElementById("remark")
.value



};



orders.push(order);



localStorage.setItem(

"orders",

JSON.stringify(orders)

);



// 保存操作员

localStorage.setItem(

"workerName",

worker

);



alert("出库成功");



// 清空

cart=[];


document
.getElementById("customer")
.value="";


document
.getElementById("money")
.value="";


document
.getElementById("remark")
.value="";


document
.getElementById("showMoney")
.innerHTML="0";



renderCart();


}




</script>


</body>

</html>
