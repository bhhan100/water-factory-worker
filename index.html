<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>水厂管家</title>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC";
background:#f5f7fb;
}

.header{
background:#1677ff;
color:white;
padding:25px;
border-radius:0 0 25px 25px;
}

.card{
background:white;
margin:15px;
padding:20px;
border-radius:20px;
}

input,select,button{
width:100%;
padding:13px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
box-sizing:border-box;
}

button{
background:#1677ff;
color:white;
border:none;
}

.add{
background:#eaf3ff;
color:#1677ff;
}

.item{
border:1px solid #eee;
padding:12px;
border-radius:15px;
margin-top:10px;
}

.total{
font-size:22px;
font-weight:bold;
color:#1677ff;
}

.delete{
background:#ff4d4f;
padding:8px;
margin-top:8px;
}

</style>

</head>


<body>


<div class="header">

<h2>💧 水厂管家</h2>

<p>工人送货端 V0.3</p>

</div>



<div class="card">

<h3>👷 工人信息</h3>

<input id="worker" placeholder="请输入工人姓名">


<h3>客户</h3>

<input id="customer" placeholder="客户姓名">


</div>




<div class="card">

<h3>🚚 本次送货商品</h3>


<div id="items">

暂无商品

</div>


<button class="add" onclick="showAdd()">

＋ 添加商品

</button>


</div>





<div class="card" id="addBox" style="display:none">


<h3>添加商品</h3>


<select id="product">

<option>瓶装水</option>

<option>普苏</option>

<option>循环桶</option>

<option>循环桶回桶</option>

<option>一次性</option>

<option>定制水</option>

</select>



<select id="unit">

<option>箱</option>

<option>桶</option>

<option>包</option>

<option>个</option>

</select>


<input id="qty" type="number" placeholder="数量">


<input id="price" type="number" placeholder="单价">


<button onclick="addItem()">

加入

</button>


</div>





<div class="card">


<h3>💰 结算</h3>


<div id="total" class="total">

应收：0 元

</div>


<select id="pay">

<option>已付款</option>

<option>未付款</option>

<option>部分付款</option>

</select>


<input id="remark" placeholder="备注">


<button onclick="submitOrder()">

提交订单

</button>


</div>






<div class="card">


<h3>📋 今日订单</h3>


<div id="orders">

暂无记录

</div>


</div>





<script>


let cart=[];


let orders=
JSON.parse(localStorage.getItem("orders")||"[]");



function showAdd(){

document.getElementById("addBox").style.display="block";

}




function addItem(){


let product=
document.getElementById("product").value;


let unit=
document.getElementById("unit").value;


let qty=
Number(document.getElementById("qty").value);


let price=
Number(document.getElementById("price").value);



if(!qty){

alert("请输入数量");

return;

}



let amount=qty*price;



if(product=="循环桶回桶"){

amount=-Math.abs(amount);

}



cart.push({

product,

unit,

qty,

price,

amount

});



renderCart();



}



function renderCart(){


let html="";

let total=0;



cart.forEach((i,index)=>{


total+=i.amount;


html+=`

<div class="item">

<b>${i.product}</b><br>

数量：
${i.qty}${i.unit}<br>

单价：
${i.price}元<br>

金额：
${i.amount}元


<button class="delete"
onclick="removeItem(${index})">

删除

</button>


</div>


`;


});



document.getElementById("items").innerHTML=
html||"暂无商品";


document.getElementById("total").innerHTML=
"应收："+total+" 元";


}




function removeItem(index){

cart.splice(index,1);

renderCart();

}




function submitOrder(){



if(cart.length==0){

alert("请添加商品");

return;

}



let total=0;


cart.forEach(i=>{

total+=i.amount;

});



let order={


编号:Date.now(),


时间:new Date().toLocaleString(),


工人:
document.getElementById("worker").value,


客户:
document.getElementById("customer").value,


商品:
cart,


金额:total,


付款:
document.getElementById("pay").value,


备注:
document.getElementById("remark").value



};



orders.push(order);



localStorage.setItem(

"orders",

JSON.stringify(orders)

);



alert("订单提交成功");



cart=[];


renderCart();

showOrders();


}




function showOrders(){


let html="";


orders.slice().reverse().forEach(o=>{


html+=`

<div class="item">

订单：
${o.编号}<br>

客户：
${o.客户}<br>

金额：
${o.金额}元<br>

付款：
${o.付款}<br>

时间：
${o.时间}


</div>


`;



});



document.getElementById("orders").innerHTML=

html||"暂无记录";


}



showOrders();


</script>


</body>

</html>
