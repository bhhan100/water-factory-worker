<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>水厂管家</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC";

background:#f5f7fb;

}


.header{

background:#1677ff;

color:white;

padding:25px;

border-radius:0 0 25px 25px;

}



.card{

background:white;

margin:15px;

padding:18px;

border-radius:20px;

box-shadow:
0 5px 20px #00000010;

}



input,
button{

width:100%;

padding:14px;

border-radius:14px;

border:1px solid #ddd;

font-size:16px;

}



button{

border:none;

background:#1677ff;

color:white;

}



.title{

font-size:18px;

font-weight:bold;

margin-bottom:15px;

}



.products{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:10px;

}



.product{

background:#eef6ff;

color:#1677ff;

padding:15px 5px;

text-align:center;

border-radius:15px;

font-size:14px;

}



.product span{

display:block;

font-size:25px;

margin-bottom:5px;

}



.item{

display:flex;

justify-content:space-between;

align-items:center;

background:#fafafa;

padding:12px;

margin-top:10px;

border-radius:15px;

}



.counter button{

width:35px;

padding:8px;

}


.money{

font-size:28px;

font-weight:bold;

color:#1677ff;

}



.pay{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:8px;

}


.pay button{

background:#eee;

color:#333;

}



.pay .active{

background:#1677ff;

color:white;

}



.submit{

margin-top:15px;

height:55px;

font-size:18px;

}



.history{

font-size:14px;

color:#666;

}



</style>


</head>



<body>


<div class="header">

<h2>💧 水厂管家</h2>

<p>工人送货端 V2.1</p>

</div>


<div class="card">


<div class="title">
👷 工人
</div>


<input id="worker"
placeholder="请输入姓名">


</div>



<div class="card">


<div class="title">
👤 客户
</div>


<input id="customer"
placeholder="输入客户名称">


<div id="history"
class="history"></div>


</div>



<div class="card">


<div class="title">
🚚 选择商品
</div>


<div class="products">


<div class="product"
onclick="addProduct('瓶装水')">

<span>🧴</span>
瓶装水

</div>


<div class="product"
onclick="addProduct('普苏')">

<span>📦</span>
普苏

</div>


<div class="product"
onclick="addProduct('循环桶')">

<span>🪣</span>
循环桶

</div>



<div class="product"
onclick="addProduct('循环桶回桶')">

<span>↩️</span>
回桶

</div>



<div class="product"
onclick="addProduct('一次性')">

<span>💧</span>
一次性

</div>



<div class="product"
onclick="addProduct('定制水')">

<span>✨</span>
定制水

</div>



</div>


<div id="cart">

暂无商品

</div>


</div>




<div class="card">


<div class="title">
💰 本单金额
</div>


<div class="money">

¥ <span id="amount">
0
</span>

</div>


<br>


<input id="moneyInput"
type="number"
placeholder="输入实际收款金额">



<div class="title">
付款状态
</div>


<div class="pay">


<button
id="paid"
onclick="setPay('已付款')">

已付款

</button>


<button
id="part"
onclick="setPay('部分付款')">

部分

</button>


<button
id="unpaid"
onclick="setPay('未付款')">

欠款

</button>


</div>



<br>


<input id="remark"
placeholder="备注">


<button class="submit"
onclick="submitOrder()">

提交订单

</button>


</div>



<script>


let cart=[];

let payStatus="已付款";


</script>


</body>

</html>
<script>

let cart = [];

let payStatus = "已付款";


// ======================
// 数据
// ======================

let orders =
JSON.parse(
localStorage.getItem("orders") || "[]"
);


// ======================
// 初始化
// ======================

let oldWorker =
localStorage.getItem("workerName");

if(oldWorker){

document.getElementById("worker").value=
oldWorker;

}


// 客户输入提示

document
.getElementById("customer")
.addEventListener("input",showHistory);




// ======================
// 添加商品
// ======================

function addProduct(name){


let item =
cart.find(
i=>i.product==name
);


if(item){

item.qty++;

}else{


cart.push({

product:name,

qty:1,

unit:
name=="循环桶回桶"?
"个":
"桶"


});


}


renderCart();


}



// ======================
// 显示购物车
// ======================


function renderCart(){


let html="";


cart.forEach((item,index)=>{


html+=`

<div class="item">


<div>

<b>
${item.product}
</b>

<br>

${item.qty}
${item.unit}

</div>


<div class="counter">


<button onclick="changeQty(${index},-1)">
-
</button>


<button onclick="changeQty(${index},1)">
+
</button>


</div>


</div>

`;



});



document.getElementById("cart")
.innerHTML =
html || "暂无商品";



}



// ======================
// 数量修改
// ======================


function changeQty(index,num){


cart[index].qty += num;



if(cart[index].qty<=0){

cart.splice(index,1);

}


renderCart();


}



// ======================
// 付款状态
// ======================


function setPay(status){


payStatus=status;



document
.querySelectorAll(".pay button")
.forEach(
b=>b.classList.remove("active")
);



if(status=="已付款"){

paid.classList.add("active");

}


if(status=="部分付款"){

part.classList.add("active");

}


if(status=="未付款"){

unpaid.classList.add("active");

}


}



// ======================
// 客户历史
// ======================


function showHistory(){


let text =
document
.getElementById("customer")
.value;



let box =
document.getElementById("history");



if(!text){

box.innerHTML="";

return;

}



let customers =
[...new Set(

orders.map(
o=>o.客户
)

)];



let result =
customers.filter(
c=>c.includes(text)
);



box.innerHTML =
result.map(

c=>

`

<div onclick="chooseCustomer('${c}')">

📌 ${c}

</div>

`

).join("");



}



function chooseCustomer(name){


document
.getElementById("customer")
.value=name;


document
.getElementById("history")
.innerHTML="";


}



// ======================
// 提交订单
// ======================


function submitOrder(){



let worker =
document
.getElementById("worker")
.value.trim();



let customer =
document
.getElementById("customer")
.value.trim();



let money =
Number(
document
.getElementById("moneyInput")
.value
);



if(!worker){

alert("请输入工人姓名");

return;

}



if(!customer){

alert("请输入客户");

return;

}



if(cart.length==0){

alert("请选择商品");

return;

}



if(!money){

alert("请输入金额");

return;

}




let order={



编号:
Date.now(),



时间:
new Date()
.toLocaleString(),



工人:
worker,



客户:
customer,



商品:
cart,



金额:
money,



付款:
payStatus,



备注:
document
.getElementById("remark")
.value



};





orders.push(order);



localStorage.setItem(

"orders",

JSON.stringify(orders)

);



// 保存工人

localStorage.setItem(

"workerName",

worker

);




alert("订单提交成功");



// 清空


cart=[];


document
.getElementById("customer")
.value="";


document
.getElementById("moneyInput")
.value="";


document
.getElementById("remark")
.value="";


renderCart();



}



// ======================
// 点击金额实时显示
// ======================


document
.getElementById("moneyInput")
.addEventListener(

"input",

function(){


document
.getElementById("amount")
.innerHTML=

this.value || 0;


}

);



</script>
